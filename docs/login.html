
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIT AlumniConnect Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f4fa;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 8px 30px #00000015;
    }

    h1 { color: #12346b; text-align: center; }
    p { text-align: center; color: #666; }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      color: white;
      background: #12346b;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    #message {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }

    .link {
      color: #12346b;
      font-weight: bold;
      text-decoration: none;
    }

    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>MIT AlumniConnect</h1>
    <p id="subtitle">Sign in to your account</p>

    <form id="loginForm">
      <label for="identifier">Username or College Email</label>
      <input id="identifier" type="text"
        placeholder="Username or firstname.lastname@mit.asia"
        autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        placeholder="Enter password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">Login</button>
    </form>

    <p id="createLink">
      Don't have an account?
      <a class="link" href="./register.html">Create Account</a>
    </p>

    <form id="changePasswordForm" class="hidden">
      <p>Set a new password before accessing the alumni directory.</p>

      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password"
        minlength="8" maxlength="200"
        autocomplete="new-password" required>

      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password"
        minlength="8" maxlength="200"
        autocomplete="new-password" required>

      <button id="changeButton" type="submit">Change Password</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const BASE_URL =
      "https://mit-alumniconnect-project-1-1.onrender.com";

    const loginForm = document.getElementById("loginForm");
    const changeForm = document.getElementById("changePasswordForm");
    const message = document.getElementById("message");
    const subtitle = document.getElementById("subtitle");
    const createLink = document.getElementById("createLink");

    function showMessage(text, success = false) {
      message.style.color = success ? "green" : "#b42318";
      message.textContent = text;
    }

    function validPassword(password) {
      return password.length >= 8 &&
        password.length <= 200 &&
        /[A-Z]/.test(password) &&
        /[a-z]/.test(password) &&
        /[0-9]/.test(password) &&
        /[^A-Za-z0-9]/.test(password);
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const identifier = document.getElementById("identifier")
        .value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const button = document.getElementById("loginButton");

      button.disabled = true;
      showMessage("Checking login...");

      try {
        const response = await fetch(`${BASE_URL}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Login failed.");
        }

        if (!result.token) {
          throw new Error("Authentication token was not received.");
        }

        sessionStorage.setItem("alumniToken", result.token);

        if (result.mustChangePassword === true) {
          loginForm.classList.add("hidden");
          changeForm.classList.remove("hidden");
          createLink.classList.add("hidden");
          subtitle.textContent = "Set your new password";
          showMessage("Please change your password.", true);
        } else {
          showMessage("Login successful! Opening directory...", true);
          window.location.replace("./index.html");
        }
      } catch (error) {
        showMessage(error.message === "Failed to fetch"
          ? "Cannot reach the login service. Please try again."
          : error.message);
      } finally {
        button.disabled = false;
      }
    });

    changeForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const oldPassword =
        document.getElementById("password").value;
      const newPassword =
        document.getElementById("newPassword").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;
      const button = document.getElementById("changeButton");
      const token = sessionStorage.getItem("alumniToken");

      if (!token) {
        showMessage("Your session expired. Please log in again.");
        changeForm.classList.add("hidden");
        loginForm.classList.remove("hidden");
        createLink.classList.remove("hidden");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      if (!validPassword(newPassword)) {
        showMessage(
          "Use at least 8 characters with uppercase, lowercase, a number and a special character."
        );
        return;
      }

      if (newPassword === oldPassword) {
        showMessage("Choose a password different from your current password.");
        return;
      }

      button.disabled = true;
      showMessage("Updating password...");

      try {
        const response = await fetch(
          `${BASE_URL}/api/change-password`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ oldPassword, newPassword })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Password change failed.");
        }

        if (result.token) {
          sessionStorage.setItem("alumniToken", result.token);
        }

        showMessage("Password changed successfully!", true);
        window.location.replace("./index.html");
      } catch (error) {
        showMessage(error.message === "Failed to fetch"
          ? "Cannot reach the server. Please try again."
          : error.message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
